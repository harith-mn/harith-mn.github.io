<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Harith Md Nasir</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .avatar {
            width: 96px;
            height: 96px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: #ffffff;
            margin: 0 auto 20px auto;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .role {
            font-size: 1rem;
            color: #38bdf8;
            font-weight: 600;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-title {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            margin-bottom: 12px;
            text-align: left;
        }

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }

        .skill-tag {
            background-color: #334155;
            color: #e2e8f0;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid #475569;
        }

        .fact-box {
            background-color: #0f172a;
            border-left: 4px solid #3b82f6;
            padding: 16px;
            border-radius: 0 8px 8px 0;
            text-align: left;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #cbd5e1;
        }

        .fact-box strong {
            color: #f1f5f9;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar">HN</div>
        <h1>Harith Md Nasir</h1>
        <div class="role">Juruteknik Peralatan</div>

        <div class="section-title">Kemahiran</div>
        <div class="skills-container">
            <span class="skill-tag">MES</span>
            <span class="skill-tag">OEE</span>
            <span class="skill-tag">Pareto Analysis</span>
            <span class="skill-tag">Preventive Maintenance</span>
        </div>

        <div class="section-title">Fakta Menarik</div>
        <div class="fact-box">
            <strong>Status Semasa:</strong> Kini sedang mengambil cuti kerjaya (career break) untuk mendalami bidang kejuruteraan perisian (software engineering).
        </div>
    </div>

</body>
</html>
